<style>
html,body{margin:0;height:100%;font-family:sans-serif}
#mappa{position:absolute;inset:0}
.leaflet-top.leaflet-right{margin-top:62px}
#barra{position:absolute;z-index:1000;top:8px;left:8px;right:8px;display:flex;gap:6px}

.bt{background:#fff;border:1px solid #999;border-radius:8px;padding:6px 10px;font-size:16px;line-height:1}
.bt svg{width:22px;height:22px;display:block}
#pannello,#risultati,#info{position:absolute;z-index:1000;left:8px;right:8px;bottom:8px;background:#fffffff5;border:1px solid #999;border-radius:10px;padding:8px 12px;display:none;font-size:14px;overflow:auto}
#pannello{max-height:62%}
#risultati{max-height:55%}
#misura{position:absolute;z-index:1000;left:8px;right:8px;bottom:8px;background:#fffffff5;border:1px solid #999;border-radius:10px;padding:8px 10px;display:none;font-size:14px;max-height:50%;overflow:auto}
#misura .tb{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
#misura .tb button{padding:7px 9px;font-size:14px;border:1px solid #999;border-radius:6px;background:#fff}
#misura .tb button.on{background:#ffd9a8;border-color:#e07000}
#misRis{white-space:pre-wrap;font-size:13px}
#info{max-height:45%;font-size:13px;white-space:pre-wrap}
#pannello h4{margin:6px 0 4px}
#pannello label{display:block;padding:3px 0}
#pannello details{border-top:1px solid #ccc;padding:4px 0}

.op{width:100%}
.f{display:flex;gap:6px;margin:4px 0}
.f input,.f select{flex:1;min-width:0;padding:8px;border:1px solid #999;border-radius:6px;font-size:15px}
.f button{padding:8px 12px;font-size:15px}
.riga{padding:9px 4px;border-bottom:1px solid #ddd}
.srv{padding:7px 2px;border-bottom:1px solid #eee}
.srv>div.t{cursor:pointer}
.lay{padding:2px 0 2px 10px;font-size:13px}
.grp{padding:3px 0 1px 10px;font-weight:bold;font-size:13px;color:#444}
.pic{font-size:12px;color:#666}
#menu{position:absolute;z-index:1001;top:54px;right:8px;background:#fffffff5;border:1px solid #999;border-radius:10px;padding:4px;display:none;font-size:15px;min-width:230px}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 10px;font-size:15px;border-bottom:1px solid #eee}
#menu button:last-child{border-bottom:0}
#leg,#sel,#stp{position:absolute;z-index:1000;left:8px;right:8px;bottom:8px;background:#fffffff5;border:1px solid #999;border-radius:10px;padding:8px 12px;display:none;font-size:14px;overflow:auto}
#leg{max-height:68%}#sel{max-height:48%;font-size:13px}
#leg details.cat{border-top:1px solid #ddd;padding:2px 0 2px 6px}#leg details.cat summary{font-weight:bold;padding:5px 0;font-size:13px}
#leg .lay{padding:3px 0 3px 8px;font-size:13px}
.mini{padding:3px 8px;font-size:12px;border:1px solid #999;border-radius:6px;background:#fff}

.selb{padding:6px 0;border-top:1px solid #ddd}
.selo{padding:4px 0;border-top:1px dashed #ccc}.selo:first-of-type{border-top:0}
button.dl{margin:3px 0;padding:8px 10px;font-size:13px;text-align:left;border:1px solid #06c;color:#06c;background:#fff;border-radius:6px;max-width:100%}
#tempo{position:absolute;z-index:1000;left:8px;right:8px;bottom:8px;background:#fffffff5;border:1px solid #999;border-radius:10px;padding:6px 10px;display:none;font-size:13px}
#tempo .r{display:flex;align-items:center;gap:6px}#tempo .r button{padding:6px 10px;font-size:15px}
#tempo input[type=range]{flex:1;min-width:0}#tmY{flex:1;min-width:0;padding:6px;font-size:14px;font-weight:bold}
#tmD{font-size:11px;color:#555;margin:2px 0}#tmJ{display:none;width:100%;margin-top:4px;padding:5px}
#tmDiv{position:absolute;z-index:999;top:0;bottom:0;width:30px;margin-left:-15px;display:none;touch-action:none}
#tmDiv:before{content:"";position:absolute;left:14px;width:3px;top:0;bottom:0;background:#fff;box-shadow:0 0 3px #000}
#tmDiv:after{content:"◀▶";position:absolute;top:50%;left:0;width:30px;margin-top:-14px;text-align:center;background:#fff;border:1px solid #666;border-radius:14px;font-size:10px;line-height:26px;height:26px}
#stampaBox{display:none}
body.stampa #stampaBox{display:block}
body.stampa #barra,body.stampa #menu,body.stampa #pannello,body.stampa #risultati,body.stampa #info,body.stampa #misura,body.stampa #leg,body.stampa #sel,body.stampa #stp,body.stampa #tempo,body.stampa #tmDiv,body.stampa #msg,body.stampa .leaflet-control-container{display:none!important}
#stampaBox .it{position:absolute;z-index:1002;top:10px;left:10px;background:#fffffff0;border:1px solid #444;padding:6px 10px;font-size:15px;max-width:70%}
#stampaBox .it span{font-size:12px;color:#333}
#stampaBox .lg{position:absolute;z-index:1002;bottom:34px;left:10px;background:#fffffff0;border:1px solid #444;padding:6px 8px;font-size:11px;max-width:48%;max-height:46%;overflow:hidden}
#stampaBox .lg img{max-width:100%}
#stampaBox .fo{position:absolute;z-index:1002;bottom:6px;left:10px;right:10px;font-size:10px;background:#ffffffe0;padding:2px 6px}
@media print{@page{margin:0}}
#msg{position:absolute;z-index:1000;top:54px;left:8px;right:60px;text-align:center;font-size:13px;color:#fff;background:#000a;border-radius:8px;padding:4px;display:none}

<div id="barra"><button class="bt" id="bCerca" style="flex:1;text-align:left">🔍 Trova sulla mappa</button><button class="bt" id="bMis" title="Strumenti di misura"><svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>

<button class="bt" id="bAltro" title="Altri strumenti: legenda, cartoteca, macchina del tempo, stampa">⋯</button>
<button class="bt" id="bLiv" title="Livelli">☰</button></div>

<script>
var RT="https://www502.regione.toscana.it/";
var SERVIZI={
 catasto:RT+"ows_catasto/com.rt.wms.RTmap/ows?map=owscatasto",
 ctr:RT+"ows_ctr/com.rt.wms.RTmap/ows?map=owsctr",
 amb:RT+"wmsraster/com.rt.wms.RTmap/wms?map=wmsambamm",
 topon:RT+"wmsraster/com.rt.wms.RTmap/wms?map=wmstoponomastica"};
var SERV_OFC=[ // ortofoto: servizi del Geoscopio, dal 1954 al 2025
 {n:"storiche 1954-2017",u:RT+"wmsraster/com.rt.wms.RTmap/wms?map=wmsofc",f:/^rt_ofc\./},
 {n:"2016-2022",u:RT+"ows_ofc/com.rt.wms.RTmap/wms?map=owsofc",f:/^rt_ofc\./},
 {n:"2021-2025",u:RT+"ows_ofc/com.rt.wms.RTmap/wms?map=owsofc_rt",f:/^rt_ofc\./},
 {n:"grigio migliorato",u:RT+"ofc_cached/wms?",f:/\.grey\.rt@96dpi$/,gr:"grigio migliorato"}];
var ATTR_RT='© <a href="https://www.regione.toscana.it/geoscopio">Regione Toscana – Geoscopio</a>';
if(/[?&]nuova=1/.test(location.search)){try{localStorage.removeItem("mappa_stato")}catch(e){}}
var STATO={};try{STATO=JSON.parse(localStorage.getItem("mappa_stato")||"{}")}catch(e){}
function salva(){try{localStorage.setItem("mappa_stato",JSON.stringify(STATO))}catch(e){}}
function msg(t){var m=document.getElementById("msg");m.textContent=t;m.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display="none"},4000)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---- rete: tutte le richieste passano dall'app (solo Geoscopio, https) ---- */
var ATTESE={},CONT=0;
function rete(metodo,url,corpo){return new Promise(function(ok,ko){
 if(!window.Android){ko("Servizio non disponibile");return}
 var id="r"+(++CONT);ATTESE[id]={ok:ok,ko:ko};Android.richiedi(id,metodo,url,corpo||"")})}
window.rispostaRete=function(id,t){var a=ATTESE[id];delete ATTESE[id];if(a)a.ok(t)};
window.erroreRete=function(id,m){var a=ATTESE[id];delete ATTESE[id];if(a)a.ko(m)};
function xml(t){var d=new DOMParser().parseFromString(t,"text/xml");if(d.getElementsByTagName("parsererror").length)throw"Risposta non valida";return d}

/* ---- mappa e sfondi ---- */
var chiaveGoogle=(window.Android&&Android.chiaveGoogle())||"";
var map=L.map("mappa",{zoomControl:false,center:STATO.c||[43.7,11.1],zoom:STATO.z||9,maxZoom:21});
L.control.zoom({position:"topright"}).addTo(map);
map.attributionControl.setPrefix(false);
map.on("moveend",function(){var c=map.getCenter();STATO.c=[c.lat,c.lng];STATO.z=map.getZoom();salva()});
var BASI={
 osm:{nome:"OpenStreetMap",mk:function(){return L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,maxNativeZoom:19,attribution:"© OpenStreetMap"})}},
 sat:{nome:"Satellite (Esri)",mk:function(){return L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:21,maxNativeZoom:19,attribution:"Esri, Maxar, Earthstar Geographics"})}}};
BASI.nessuno={nome:"Nessuno sfondo (solo livelli)",mk:function(){return L.layerGroup()}};
function sessioneGoogle(tipo,cb){
 var prev=STATO["gs_"+tipo];
 if(prev&&prev.exp>Date.now()+3600000){return cb(prev.tok)}
 fetch("https://tile.googleapis.com/v1/createSession?key="+encodeURIComponent(chiaveGoogle),{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({mapType:tipo=="sat"?"satellite":"roadmap",language:"it-IT",region:"IT",layerTypes:tipo=="sat"?["layerRoadmap"]:[],overlay:false})})
 .then(function(r){return r.json()}).then(function(j){
   if(!j.session){msg("Google: "+((j.error&&j.error.message)||"sessione non creata"));return}
   STATO["gs_"+tipo]={tok:j.session,exp:parseInt(j.expiry||0)*1000};salva();cb(j.session)})
 .catch(function(){msg("Google non raggiungibile")});}
if(chiaveGoogle){
 [["roadmap","gmap","Google Mappa","road"],["satellite","gsat","Google Satellite","sat"]].forEach(function(x){
  BASI[x[1]]={nome:x[2],mk:function(){var tl=L.tileLayer("",{maxZoom:21,attribution:"© Google"});
   sessioneGoogle(x[3],function(tok){tl.setUrl("https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session="+tok+"&key="+encodeURIComponent(chiaveGoogle))});return tl}}})}
var baseId=STATO.base&&BASI[STATO.base]?STATO.base:(BASI.gsat?"gsat":"sat");
var baseLayer=null;
function impostaBase(id){baseId=id;STATO.base=id;salva();if(baseLayer)map.removeLayer(baseLayer);baseLayer=BASI[id].mk();baseLayer.addTo(map);if(baseLayer.bringToBack)baseLayer.bringToBack();document.getElementById("mappa").style.background=id=="nessuno"?"#fff":"#ddd"}
impostaBase(baseId);

/* ---- livelli principali ---- */
var DEF=[
 {id:"ctr",nome:"CTR 1:10.000 (Carta Tecnica Regionale)",srv:"ctr",lay:"rt_ctr.10k",fmt:"image/png",tr:true,op:.9,on:false,nonInterr:true},
 {id:"cat",nome:"Catasto terreni e fabbricati (tutto)",srv:"catasto",lay:"rt_cat.idcatacque.rt,rt_cat.idcatstrade.rt,rt_cat.idcatfabbr.rt,rt_cat.idcatpart.rt,rt_cat.idetichettecatpart.rt,rt_cat.idcatbdfog.rt,rt_cat.idcattopon.rt",fmt:"image/png",tr:true,op:.9,on:true,info:true,ql:"rt_cat.idcatpart.rt",sel:[["rt_cat.idcatpart.rt","Catasto – particelle"],["rt_cat.idcatfabbr.rt","Catasto – fabbricati"]]},
 {id:"part",nome:"Catasto – solo particelle e numeri",srv:"catasto",lay:"rt_cat.idcatpart.rt,rt_cat.idetichettecatpart.rt",fmt:"image/png",tr:true,op:.9,on:false,info:true,ql:"rt_cat.idcatpart.rt",sel:[["rt_cat.idcatpart.rt","Catasto – particelle"]]},
 {id:"fab",nome:"Catasto – solo fabbricati",srv:"catasto",lay:"rt_cat.idcatfabbr.rt",fmt:"image/png",tr:true,op:.9,on:false,sel:[["rt_cat.idcatfabbr.rt","Catasto – fabbricati"]]},
 {id:"com",nome:"Confini comunali",srv:"amb",lay:"rt_ambamm.idcomuni.rt.poly",fmt:"image/png",tr:true,op:1,on:false,sel:[["rt_ambamm.idcomuni.rt.poly","Confini comunali"]]}];
var REV=STATO.rev||0;
function mkWms(url,lay,fmt,tr,op,z){var o={layers:lay,format:fmt,transparent:tr,version:"1.3.0",opacity:op,attribution:ATTR_RT,maxZoom:21,tileSize:256,zIndex:z};if(REV)o._r=REV;return L.tileLayer.wms(url,o)}
function statoLiv(id,d){STATO["l_"+id]={on:d.on,op:d.op};salva()}
DEF.forEach(function(d,i){
 var s=STATO["l_"+d.id]||{};d.on=s.on!==undefined?s.on:d.on;d.op=s.op!==undefined?s.op:d.op;
 d.z=20+i;d.layer=mkWms(SERVIZI[d.srv],d.lay,d.fmt,d.tr,d.op,d.z);
 d.layer.on("tileerror",function(){msg("Il servizio della Regione non risponde ("+d.nome+")")});
 if(d.on)d.layer.addTo(map)});

/* ---- ortofoto: tutti gli strati 1954 → oggi ---- */
var OFC={on:false,op:1,voci:null,sel:STATO.ofcSel||null,layer:null};
if(STATO.ofc){OFC.on=!!STATO.ofc.on;OFC.op=STATO.ofc.op!=null?STATO.ofc.op:1}
function anno(t){var m=(t||"").match(/\b(19|20)\d\d\b/);return m?+m[0]:0}
function caricaOfc(){
 if(OFC.voci)return Promise.resolve(OFC.voci);
 if(OFC.p)return OFC.p;
 var falliti=[];
 function leggi(sv,riprova){return rete("GET",sv.u+"&SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities").then(function(t){
   return layerCap(xml(t)).filter(function(l){return l.name&&sv.f.test(l.name)&&!/\.qu$/.test(l.name)&&!/quadro di unione/i.test(l.title)}).map(function(l){l.srv=sv.u;l.gr=sv.gr;return l})})
  .catch(function(){if(riprova)return leggi(sv,false);falliti.push(sv.n);return []})}
 OFC.p=Promise.all(SERV_OFC.map(function(sv){return leggi(sv,true)}))
 .then(function(a){var v=[].concat.apply([],a);
   v.forEach(function(l){var r=(l.title+" "+l.name).match(/\b(20\d\d)\s*\/\s*(20\d\d)\b/);l.anno=anno(l.title)||anno(l.name);l.periodo=r?r[1]+"/"+r[2]:String(l.anno);l.falso=/false color|nir|grey/i.test(l.title)});
   v.sort(function(a,b){return b.anno-a.anno||(a.falso-b.falso)||a.title.localeCompare(b.title)});
   OFC.voci=v;OFC.p=null;OFC.falliti=falliti;
   if(!v.length)msg("Elenco ortofoto non disponibile: controlla la connessione e tocca «Aggiorna mappa e strati»");
   else if(falliti.length){OFC.voci=null;msg("Alcuni elenchi ortofoto non sono stati caricati ("+falliti.join(", ")+"): tocca «Aggiorna mappa e strati» per riprovare")}
   return v});
 return OFC.p}
function impostaOfc(){
 if(OFC.layer){map.removeLayer(OFC.layer);OFC.layer=null}
 if(!OFC.on||!OFC.sel)return;
 OFC.layer=mkWms(OFC.sel.u,OFC.sel.l,"image/jpeg",false,OFC.op,5);OFC.layer.addTo(map);
 OFC.layer.on("tileerror",function(){msg("Ortofoto non disponibile qui (zona non coperta da questo volo)")})}
function titoloCorto(l){
 var sc=(l.name.match(/\.(\d+)k/)||[])[1];var scala=sc?"1:"+(+sc*1000).toLocaleString("it-IT"):"";
 var v;var T=l.title;
 if(/banda nir/i.test(T))v="banda NIR";
 else if(/(\dR \dG \dB)/.test(T))v="falso colore "+T.match(/(\dR \dG \dB)/)[1].replace(/ /g,"");
 else if(/grey/i.test(T))v="grigio migliorato";
 else if(/\bcol\b|colore|RGB/i.test(T))v="colore";
 else v="";
 var extra=(T.match(/aulla|fi po|apuane|grosseto/i)||[""])[0];
 return (l.periodo||l.anno)+" · "+[scala,v,extra].filter(Boolean).join(" · ")}
if(!OFC.sel)OFC.sel={u:SERV_OFC[2].u,l:"rt_ofc.5k24.32bit",t:"2024 · 1:5.000 · colore"};
impostaOfc();

/* ---- capabilities generiche ---- */
function layerCap(doc){var out=[];
 (function walk(el,d,grp){
  Array.prototype.forEach.call(el.children,function(c){if(c.localName!="Layer")return;
   var n=null,t="";Array.prototype.forEach.call(c.children,function(x){if(x.localName=="Name"&&n===null)n=x.textContent;if(x.localName=="Title"&&!t)t=x.textContent});
   out.push({name:n,title:t||n||"",depth:d});walk(c,d+1)})})(doc.documentElement.getElementsByTagName("Capability")[0]||doc.documentElement,0);
 return out}
var CAPS={};
function capServizio(u){if(CAPS[u])return Promise.resolve(CAPS[u]);
 return rete("GET",u+"&SERVICE=WMS&VERSION=1.3.0&REQUEST=GetCapabilities").then(function(t){return CAPS[u]=layerCap(xml(t))})}

/* ---- livelli aggiunti dal sottomenu "Tutti i WMS" ---- */
/* ArcGIS Server (Autorità di bacino): tile da /export, riproiettate in 3857 dal server */
L.TileLayer.ArcgisExport=L.TileLayer.extend({getTileUrl:function(c){
 var z=this._getZoomForUrl(),R=20037508.342789244,res=2*R/(256*Math.pow(2,z)),x0=-R+c.x*256*res,y1=R-c.y*256*res,bb=[x0,y1-256*res,x0+256*res,y1].join(",");
 return this._url+"/export?bbox="+bb+"&bboxSR=3857&imageSR=3857&size=256,256&dpi=96&format=png32&transparent=true&layers=show:"+this.options.lay+"&f=image"+(REV?"&_r="+REV:"")}});
function mkArcgis(u,lay,op,z){return new L.TileLayer.ArcgisExport(u,{lay:lay,opacity:op,attribution:"© Autorità di bacino distrettuale dell'Appennino Settentrionale",maxZoom:21,tileSize:256,zIndex:z})}
var EXTRA=[];var EXTRA_SALVATI=STATO.extra||[];
function salvaExtra(){STATO.extra=EXTRA.map(function(e){return{u:e.u,l:e.l,t:e.t,op:e.op}});salva()}
function aggiungiExtra(u,l,t,op){
 var e={u:u,l:l,t:t,op:op==null?.85:op};e.layer=/\/MapServer$/.test(u)?mkArcgis(u,l,e.op,40+EXTRA.length):mkWms(u,l,"image/png",true,e.op,40+EXTRA.length);
 e.layer.on("tileerror",function(){msg("Il livello \""+t+"\" non risponde qui")});e.layer.addTo(map);EXTRA.push(e);salvaExtra();return e}
function togliExtra(u,l){EXTRA=EXTRA.filter(function(e){if(e.u==u&&e.l==l){map.removeLayer(e.layer);return false}return true});salvaExtra()}
function haExtra(u,l){return EXTRA.some(function(e){return e.u==u&&e.l==l})}
EXTRA_SALVATI.forEach(function(e){aggiungiExtra(e.u,e.l,e.t,e.op)});

/* ---- pannello livelli ---- */
var pan=document.getElementById("pannello"),ris=document.getElementById("risultati"),infoEl=document.getElementById("info");

proj4.defs("EPSG:32632","+proj=utm +zone=32 +datum=WGS84 +units=m +no_defs");
proj4.defs("EPSG:3003","+proj=tmerc +lat_0=0 +lon_0=9 +k=0.9996 +x_0=1500000 +y_0=0 +ellps=intl +towgs84=-104.1,-49.1,-9.9,0.971,-2.917,0.714,-11.68 +units=m +no_defs");
var misEl=document.getElementById("misura");
var MIS={modo:null,pts:[],g:L.layerGroup().addTo(map),coord:null};
function rad(x){return x*Math.PI/180}function gra(x){return x*180/Math.PI}
function vinc(a,b){ // distanza e azimut sull'ellissoide WGS84 (Vincenty inverso)
 var A=6378137,F=1/298.257223563,B=(1-F)*A;
 var U1=Math.atan((1-F)*Math.tan(rad(a.lat))),U2=Math.atan((1-F)*Math.tan(rad(b.lat))),Lg=rad(b.lng-a.lng),lam=Lg,i=0,s1,c1,sg,cg,sig,sa,c2a,c2m;
 var sU1=Math.sin(U1),cU1=Math.cos(U1),sU2=Math.sin(U2),cU2=Math.cos(U2);
 if(a.lat==b.lat&&a.lng==b.lng)return{d:0,az:0};
 do{var sl=Math.sin(lam),cl=Math.cos(lam);sg=Math.sqrt(Math.pow(cU2*sl,2)+Math.pow(cU1*sU2-sU1*cU2*cl,2));
  if(sg==0)return{d:0,az:0};cg=sU1*sU2+cU1*cU2*cl;sig=Math.atan2(sg,cg);sa=cU1*cU2*sl/sg;c2a=1-sa*sa;
  c2m=c2a?cg-2*sU1*sU2/c2a:0;var C=F/16*c2a*(4+F*(4-3*c2a));var lp=lam;
  lam=Lg+(1-C)*F*sa*(sig+C*sg*(c2m+C*cg*(-1+2*c2m*c2m)));if(Math.abs(lam-lp)<1e-12)break}while(++i<100);
 var u2=c2a*(A*A-B*B)/(B*B),Aa=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2))),Bb=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
 var ds=Bb*sg*(c2m+Bb/4*(cg*(-1+2*c2m*c2m)-Bb/6*c2m*(-3+4*sg*sg)*(-3+4*c2m*c2m)));
 var az=Math.atan2(cU2*Math.sin(lam),cU1*sU2-sU1*cU2*Math.cos(lam));
 return{d:B*Aa*(sig-ds),az:(gra(az)+360)%360}}
function areaEll(pts){ // area esatta: proiezione equivalente (Lambert azimutale) centrata sul poligono
 var la=0,lo=0;pts.forEach(function(p){la+=p.lat;lo+=p.lng});la/=pts.length;lo/=pts.length;
 var d="+proj=laea +lat_0="+la+" +lon_0="+lo+" +ellps=WGS84 +x_0=0 +y_0=0 +units=m +no_defs";
 var q=pts.map(function(p){return proj4("EPSG:4326",d,[p.lng,p.lat])}),s=0;
 for(var i=0;i<q.length;i++){var j=(i+1)%q.length;s+=q[i][0]*q[j][1]-q[j][0]*q[i][1]}return Math.abs(s)/2}
function fL(m){return m<1000?m.toFixed(2)+" m":(m/1000).toFixed(3)+" km ("+m.toFixed(1)+" m)"}
function fA(a){var s=a.toFixed(2)+" m²";if(a>=1e4)s+="\n   = "+(a/1e4).toFixed(4)+" ha";if(a>=1e6)s+=" = "+(a/1e6).toFixed(4)+" km²";return s}
function dms(x,pos,neg){var s=x<0?neg:pos;x=Math.abs(x);var g=Math.floor(x),m=Math.floor((x-g)*60),sec=((x-g)*60-m)*60;return g+"° "+m+"' "+sec.toFixed(2)+'" '+s}
function fAng(g){g=((g%360)+360)%360;return g.toFixed(4)+"° = "+dms(g,"","").trim()+" = "+(g*400/360).toFixed(4)+" gon"}
function misDisegna(){MIS.g.clearLayers();var P=MIS.pts,st={color:"#e07000",weight:3,dashArray:"6 4"},out="",m=MIS.modo;
 P.forEach(function(p,i){L.circleMarker(p,{radius:5,color:"#e07000",fillColor:"#fff",fillOpacity:1,weight:2}).addTo(MIS.g)});
 if(m=="dist"){if(P.length>1)L.polyline(P,st).addTo(MIS.g);
  if(P.length<2)out="Tocca la mappa per segnare i punti (min. 2).";else{var tot=0;for(var i=1;i<P.length;i++){var v=vinc(P[i-1],P[i]);tot+=v.d;out+="Tratto "+i+": "+fL(v.d)+"  (azimut "+v.az.toFixed(2)+"°)\n"}out+="TOTALE: "+fL(tot)}}
 else if(m=="area"){if(P.length>2)L.polygon(P,st).addTo(MIS.g);else if(P.length==2)L.polyline(P,st).addTo(MIS.g);
  if(P.length<3)out="Tocca la mappa per segnare i vertici (min. 3).";else{var per=0;for(var i=0;i<P.length;i++)per+=vinc(P[i],P[(i+1)%P.length]).d;out="Area: "+fA(areaEll(P))+"\nPerimetro: "+fL(per)+"\nVertici: "+P.length}}
 else if(m=="ang"){if(P.length>1)L.polyline(P,st).addTo(MIS.g);
  if(P.length<3)out="Tocca 3 punti: il secondo è il vertice dell'angolo ("+P.length+"/3).";else{var A=vinc(P[1],P[0]),C=vinc(P[1],P[2]);var d=Math.abs(A.az-C.az);if(d>180)d=360-d;
   out="Angolo al vertice: "+fAng(d)+"\nLato 1: "+fL(A.d)+"  (azimut "+A.az.toFixed(2)+"°)\nLato 2: "+fL(C.d)+"  (azimut "+C.az.toFixed(2)+"°)"}}
 else if(m=="cer"){if(P.length>1){var r=vinc(P[0],P[1]).d;L.circle(P[0],{radius:r,color:"#e07000",weight:3,dashArray:"6 4",fillOpacity:.08}).addTo(MIS.g);
   out="Raggio: "+fL(r)+"\nCirconferenza: "+fL(2*Math.PI*r)+"\nArea: "+fA(Math.PI*r*r)+"\n(area calcolata sul piano tangente: per cerchi grandi è approssimata)"}else out="Tocca il centro, poi un punto del bordo."}
 else if(m=="coo"){if(!P.length)out="Tocca un punto per leggere le coordinate.";else{var q=P[P.length-1];
   var u=proj4("EPSG:4326","EPSG:32632",[q.lng,q.lat]),g=proj4("EPSG:4326","EPSG:3003",[q.lng,q.lat]);
   out="WGS84 (gradi): "+q.lat.toFixed(7)+", "+q.lng.toFixed(7)+"\nWGS84 (gradi, primi, secondi):\n   "+dms(q.lat,"N","S")+"\n   "+dms(q.lng,"E","W")+"\nUTM fuso 32N (WGS84/ETRS89): E "+u[0].toFixed(2)+"  N "+u[1].toFixed(2)+"\nGauss-Boaga fuso Ovest (Roma 40, INDICATIVA, scarto possibile di alcuni metri): E "+g[0].toFixed(1)+"  N "+g[1].toFixed(1)}}
 document.getElementById("misRis").textContent=out}
